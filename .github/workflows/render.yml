name: Render and publish Quarto site

on:
  push:
    branches: [main, master]
    paths:
      - "*.qmd"
      - "_partials/**"
      - "_quarto.yml"
      - "styles.css"
      - "assets/**"
      - "R/**"
      - "data/**"
      - "downloads/**"
      - "tools/**"
      - "DESCRIPTION"
      - ".github/workflows/render.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            any::tidyverse
            any::readxl
            any::janitor
            any::lubridate
            any::plotly
            any::htmlwidgets
            any::DT
            any::glue
            any::scales
            any::htmltools
            any::forcats
            any::writexl
            any::jsonlite
            
      - name: Install Python QA dependencies
        run: |
          python3 -m pip install --disable-pip-version-check "openpyxl>=3.1,<4"

      - name: Validate versioned frontend bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -s _partials/setup-core.qmd
          git ls-files --error-unmatch _partials/setup-core.qmd >/dev/null
          grep -Fq '<script src="assets/rigi-responsive.js" defer></script>' _partials/setup-core.qmd
          node --check assets/rigi-responsive.js
          node --check assets/investment_modules.js
          node --check assets/planes_inversion.js
          node --check assets/importaciones.js
          python3 tools/qa_mobile_layout.py

      - name: Validate R text encoding and project cards
        run: |
          Rscript tools/qa_encoding.R
          quarto --version
          Rscript tools/diagnose_plotly_dependency.R
          python3 tools/qa_final_ui_refinements.py
          python3 tools/qa_peelp_cards.py

      - name: Remove generated state from previous renders
        shell: bash
        run: |
          rm -rf .quarto _freeze _site
          find . -maxdepth 1 -type d -name '*_cache' -exec rm -rf {} +
          find . -maxdepth 1 -type d -name '*_files' -exec rm -rf {} +

      - name: Render Quarto project
        run: quarto render

      - name: Install browser for rendered-module QA
        run: |
          python3 -m pip install --disable-pip-version-check "playwright>=1.45,<2"
          python3 -m playwright install --with-deps chromium

      - name: Verify rendered interactive modules
        env:
          RIGI_REQUIRE_BROWSER: "1"
        shell: bash
        run: |
          set -euo pipefail
          page="_site/aprobados.html"
          test -s "$page"
          test -s _site/aprobados.html
          test -s _site/assets/planes_inversion.js
          test -s _site/assets/importaciones.js
          grep -Fq 'planes-inversion-module' _site/aprobados.html
          grep -Fq 'importaciones-module' _site/aprobados.html

          for asset in \
            assets/rigi-responsive.js \
            assets/investment_modules.js \
            assets/planes_inversion.js \
            assets/importaciones.js; do
            test -s "_site/$asset"
          done

          grep -Fq 'site_libs/plotly-main-' "$page"
          mapfile -t plotly_refs < <(
            grep -oE 'site_libs/plotly-main-[^"[:space:]]+/plotly-latest\.min\.js' "$page"
          )
          test "${#plotly_refs[@]}" -eq 1
          test -s "_site/${plotly_refs[0]}"
          find _site/site_libs -path '*plotly-main-*' -type f -name '*.js' -print
          grep -Fq 'assets/investment_modules.js' "$page"
          grep -Fq 'assets/planes_inversion.js' "$page"
          grep -Fq 'assets/importaciones.js' "$page"

          evaluation_page="_site/evaluacion.html"
          database_page="_site/base-datos.html"
          comparison_page="_site/comparacion.html"
          test -s "$evaluation_page"
          test -s "$database_page"
          test -s "$comparison_page"
          grep -Fq 'En evaluación' "$evaluation_page"
          grep -Fq 'En evaluación' "$database_page"

          for module_id in \
            rigi-investment-approved-total-investment \
            rigi-investment-approved-computable-assets \
            rigi-investment-approved-two-year-commitment; do
            grep -Fq "$module_id" "$page"
          done

          grep -Fq 'rigi-investment-evaluation-total-investment' "$evaluation_page"
          grep -Fq 'rigi-employment-approved-employment' "$page"
          grep -Fq 'rigi-commitment-schedule' "$page"
          grep -Fq 'rigi-peelp-share' "$page"
          grep -Fq 'rigi-peelp-ranking' "$page"
          grep -Fq 'rigi-comparison-territorial-sectoral' "$comparison_page"

          responsive_count="$(grep -Fo 'assets/rigi-responsive.js' "$page" | wc -l | tr -d ' ')"
          test "$responsive_count" -eq 1

          for element_id in \
            planes-inversion-module \
            planes-inversion-data \
            planes-annual-chart \
            planes-cumulative-chart \
            importaciones-module \
            importaciones-data \
            impo-sector-monthly-chart \
            impo-sector-cumulative-chart \
            impo-project-monthly-chart \
            impo-project-cumulative-chart; do
            grep -Fq "$element_id" "$page"
          done

          python3 tools/qa_plotly_modules.py
          python3 tools/qa_ranked_modules.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
