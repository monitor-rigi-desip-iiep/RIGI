project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - aprobados.qmd
    - evaluacion.qmd
    - comparacion.qmd
    - base-datos.qmd
    - metodologia.qmd
  preview:
    navigate: false
  resources:
    - downloads/*.xlsx
    - downloads/*.csv
    - assets/rigi-responsive.js
    - assets/planes_inversion.js
    - assets/importaciones.js

website:
  title: "Monitor de Proyectos RIGI"
  site-url: "https://monitor-rigi-desip-iiep.github.io/RIGI/"
  repo-url: "https://github.com/monitor-rigi-desip-iiep/RIGI"
  page-footer:
    left: "DESIP · IIEP"
    right: "Monitor de Proyectos RIGI"
  navbar:
    title: "DESIP · IIEP"
    pinned: true
    collapse-below: lg
    background: "#0B2D5C"
    foreground: "#FFFFFF"
    left:
      - href: index.qmd
        text: Resumen
      - href: aprobados.qmd
        text: Aprobados
      - href: evaluacion.qmd
        text: En evaluación
      - href: comparacion.qmd
        text: Comparación
      - href: base-datos.qmd
        text: Base de datos
      - href: metodologia.qmd
        text: Metodología
format:
  html:
    theme:
      - cosmo
    css: styles.css
    toc: false
    page-layout: full
    code-fold: true
    code-tools: false
    smooth-scroll: true

execute:
  echo: false
  warning: false
  message: false
  cache: false
  freeze: false
